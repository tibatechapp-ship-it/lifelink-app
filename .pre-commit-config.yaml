# Pre-commit hooks — lifelink-app
#
# Install (once):
#   pip install pre-commit
#   pre-commit install
#
# `language: system` on purpose: the hooks reuse the env you already
# provisioned (make install) — no per-hook virtualenv downloads.

default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=2000"]
      - id: mixed-line-ending

  - repo: local
    hooks:
      # Lint — fast, staged Python files only. Alembic revisions are excluded
      # by ruff.toml's extend-exclude and never reach this gate.
      - id: ruff
        name: ruff check
        entry: ruff check --force-exclude
        language: system
        types: [python]
        pass_filenames: true

      # Full test suite (sqlite, no services needed — seconds, not minutes).
      # `env DATABASE_URL=` keeps the run hermetic: an ambient platform URL
      # must not decide where the suite writes (same guard as `make test`).
      - id: pytest
        name: pytest
        entry: env DATABASE_URL= python3 -m pytest tests/ -q
        language: system
        pass_filenames: false
