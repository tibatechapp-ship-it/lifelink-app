{% extends "base.html" %}
{% block title %}LifeLink — تسجيل متبرع{% endblock %}

{% block content %}
<section class="max-w-3xl mx-auto px-4 py-12">
  <div class="bg-white rounded-3xl shadow-2xl p-8 sm:p-12">
    <div class="text-center mb-8">
      <div class="text-5xl mb-3">🤝</div>
      <h1 class="text-3xl sm:text-4xl font-black text-blood-700">سجّل كمتبرع</h1>
      <p class="text-gray-600 mt-2">انضم إلى شبكة LifeLink وكن سبباً في إنقاذ حياة.</p>
    </div>

    <form id="donorForm" class="space-y-5">
      <div class="grid sm:grid-cols-2 gap-5">
        <div>
          <label for="donor-name" class="block text-sm font-bold mb-1">الاسم الكامل *</label>
          <input id="donor-name" name="name" required autocomplete="name" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blood-500 focus:ring-2 focus:ring-blood-200 outline-none transition" placeholder="أحمد محمد">
        </div>
        <div>
          <label for="donor-email" class="block text-sm font-bold mb-1">البريد الإلكتروني *</label>
          <input id="donor-email" name="email" type="email" required autocomplete="email" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blood-500 focus:ring-2 focus:ring-blood-200 outline-none transition" placeholder="ahmed@example.com">
        </div>
      </div>
      <div class="grid sm:grid-cols-2 gap-5">
        <div>
          <label for="donor-phone" class="block text-sm font-bold mb-1">رقم الهاتف *</label>
          <input id="donor-phone" name="phone" type="tel" inputmode="tel" required autocomplete="tel" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blood-500 focus:ring-2 focus:ring-blood-200 outline-none transition" placeholder="+964 7XX XXX XXXX">
        </div>
        <div>
          <label for="donor-blood" class="block text-sm font-bold mb-1">فصيلة الدم *</label>
          <select id="donor-blood" name="blood_type" required autocomplete="off" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blood-500 focus:ring-2 focus:ring-blood-200 outline-none transition">
            <option value="">اختر فصيلة الدم</option>
            <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
            <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
          </select>
        </div>
      </div>
      <div class="grid sm:grid-cols-3 gap-5">
        <div>
          <label for="donor-city" class="block text-sm font-bold mb-1">المدينة *</label>
          <input id="donor-city" name="city" required autocomplete="address-level2" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blood-500 focus:ring-2 focus:ring-blood-200 outline-none transition" placeholder="بغداد">
        </div>
        <div>
          <label for="donor-age" class="block text-sm font-bold mb-1">العمر *</label>
          <input id="donor-age" name="age" type="number" min="18" max="65" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blood-500 focus:ring-2 focus:ring-blood-200 outline-none transition" placeholder="25">
        </div>
        <div>
          <label for="donor-weight" class="block text-sm font-bold mb-1">الوزن (كغ) *</label>
          <input id="donor-weight" name="weight" type="number" min="45" max="250" step="0.1" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-blood-500 focus:ring-2 focus:ring-blood-200 outline-none transition" placeholder="70">
          <p class="text-xs text-gray-500 mt-1">الحد الأدنى للتبرع 45 كغ</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <input type="checkbox" name="available" id="available" checked class="w-5 h-5 accent-blood-600">
        <label for="available" class="text-sm">أنا متاح للتبرع حالياً</label>
      </div>
      <button type="submit" id="donorSubmit" class="btn btn-primary w-full text-lg rounded-xl">
        🤝 سجّل الآن
      </button>
    </form>

    <div id="result" class="mt-6 hidden" role="alert" aria-live="assertive"></div>
  </div>
</section>
{% endblock %}

{% block extra_scripts %}
<script>
  document.getElementById('donorForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const btn = document.getElementById('donorSubmit');
    const data = Object.fromEntries(new FormData(form));
    data.age = parseInt(data.age);
    data.weight = parseFloat(data.weight);
    data.available = form.available.checked;
    btn.disabled = true;
    const original = btn.innerHTML;
    btn.textContent = 'جارٍ التسجيل...';
    try {
      const res = await fetch('/api/donors', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(data)
      });
      const json = await res.json().catch(()=>({}));
      const box = document.getElementById('result');
      box.classList.remove('hidden');
      if (res.ok) {
        box.className = 'mt-6 p-4 rounded-xl bg-hope-100 text-hope-700 font-bold';
        box.textContent = '✅ تم التسجيل بنجاح! معرفك: ' + json.id + ' — فصيلة دمك: ' + json.blood_type;
        form.reset();
        box.scrollIntoView({ behavior: 'smooth', block: 'center' });
      } else {
        box.className = 'mt-6 p-4 rounded-xl bg-blood-100 text-blood-700 font-bold';
        box.textContent = '❌ ' + (json.error || 'حدث خطأ — تحقق من الحقول وأعد المحاولة');
        box.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    } catch (err) {
      const box = document.getElementById('result');
      box.classList.remove('hidden');
      box.className = 'mt-6 p-4 rounded-xl bg-blood-100 text-blood-700 font-bold';
      box.textContent = '❌ تعذر الاتصال بالخادم — تحقق من الشبكة وأعد المحاولة.';
    } finally {
      btn.disabled = false;
      btn.innerHTML = original;
    }
  });
</script>
{% endblock %}
